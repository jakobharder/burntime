name: release

on:
  push:
    tags:
      - "*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish source/Burntime.MonoGame -c Release /p:DebugSymbols=false /p:PublishReadyToRun=false /p:TieredCompilation=false --self-contained /p:PublishSingleFile=true

      - name: Build tools
        run: dotnet build source/PakConverter -c Release /p:DebugSymbols=false

      - name: Create paks
        working-directory: bin/Release/win-x64/publish/game
        run: |
          ../../../../tools/Release/PakConverter.exe classic
          ../../../../tools/Release/PakConverter.exe classic_de
          ../../../../tools/Release/PakConverter.exe classic_newgfx
          ../../../../tools/Release/PakConverter.exe amiga
          ../../../../tools/Release/PakConverter.exe music

      - name: Remove source folders
        run: |
          rm -r ./bin/Release/win-x64/publish/game/classic
          rm -r ./bin/Release/win-x64/publish/game/classic_newgfx
          rm -r ./bin/Release/win-x64/publish/game/classic_de
          rm -r ./bin/Release/win-x64/publish/game/classic_es
          rm -r ./bin/Release/win-x64/publish/game/classic_jp
          rm -r ./bin/Release/win-x64/publish/game/amiga
          rm -r ./bin/Release/win-x64/publish/game/music

      - name: Package
        run: |
          rm ./bin/Release/win-x64/publish/*.pdb
          tar -caf burntime-${{ github.ref_name }}.zip -C ./bin/Release/win-x64/publish *

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: burntime-${{ github.ref_name }}.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build ad-hoc signed DMG
        run: ./packaging/macos/package.sh arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos-arm64/Burntime-macOS-arm64.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish linux-x64
        run: >-
          dotnet publish source/Burntime.MonoGame/Burntime.MonoGame.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:DebugSymbols=false
          -p:PublishReadyToRun=false
          -p:TieredCompilation=false
          -p:PublishSingleFile=true

      - name: Build tools
        run: dotnet build source/PakConverter -c Release -p:DebugSymbols=false

      - name: Create paks
        working-directory: bin/Release/linux-x64/publish/game
        run: |
          ../../../../tools/Release/PakConverter classic
          ../../../../tools/Release/PakConverter classic_de
          ../../../../tools/Release/PakConverter classic_newgfx
          ../../../../tools/Release/PakConverter amiga
          ../../../../tools/Release/PakConverter music

      - name: Remove source folders
        run: |
          rm -r ./bin/Release/linux-x64/publish/game/classic
          rm -r ./bin/Release/linux-x64/publish/game/classic_newgfx
          rm -r ./bin/Release/linux-x64/publish/game/classic_de
          rm -r ./bin/Release/linux-x64/publish/game/classic_es
          rm -r ./bin/Release/linux-x64/publish/game/classic_jp
          rm -r ./bin/Release/linux-x64/publish/game/amiga
          rm -r ./bin/Release/linux-x64/publish/game/music

      - name: Package
        run: tar -czf burntime-${{ github.ref_name }}-linux-x64.tar.gz -C bin/Release/linux-x64/publish .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: burntime-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
