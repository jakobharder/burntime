name: macOS

on:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "resources/**"
      - "packaging/macos/**"
      - ".github/workflows/macos.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build source/Burntime.MonoGame/Burntime.MonoGame.csproj --configuration Release
