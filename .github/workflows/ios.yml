name: iPad

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "resources/**"
      - "packaging/ios/**"
      - ".github/workflows/ios.yml"
      - "global.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - name: Install matching iOS workload
        run: dotnet workload install ios --version 10.0.101.1
      - name: Validate iPad simulator build
        run: >-
          dotnet build source/Burntime.iOS/Burntime.iOS.csproj
          -c Debug -r iossimulator-arm64
          -p:MtouchInterpreter=all
          -p:EnableCodeSigning=false -p:BuildIpa=false
          --disable-build-servers --maxcpucount:1
